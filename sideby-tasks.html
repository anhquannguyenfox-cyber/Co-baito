<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useRef } = React;

/* ---------------------------------------------------------------------
   Preset workflows — selecting one on the left repopulates the week
   with a sensible default spread across Monday - Friday.
--------------------------------------------------------------------- */

let uid = 1;
const nextId = () => `t${uid++}`;

function makeCard(title, duration, status = 'todo') {
  return { id: nextId(), title, duration, status };
}

const DAYS = ['mon', 'tue', 'wed', 'thu', 'fri'];
const ALL_COLUMNS = [...DAYS, 'unplaced'];
const DAY_META = {
  mon: { label: 'Monday' },
  tue: { label: 'Tuesday' },
  wed: { label: 'Wednesday' },
  thu: { label: 'Thursday' },
  fri: { label: 'Friday' },
};

function emptyWeek() {
  return { mon: [], tue: [], wed: [], thu: [], fri: [], unplaced: [] };
}

const PRESETS = {
  '3D Rendering Pipeline': {
    icon: 'cube',
    blurb: 'Sculpt \u2192 shade \u2192 render \u2192 grade',
    build: () => ({
      mon: [makeCard('Sculpting', '90m', 'doing'), makeCard('Render environment', '45m')],
      tue: [makeCard('Shading', '60m'), makeCard('Render character', '60m')],
      wed: [makeCard('Coloring', '45m')],
      thu: [makeCard('Compositing', '40m')],
      fri: [makeCard('Final export', '20m')],
    }),
  },
  'Software Feature': {
    icon: 'code',
    blurb: 'Spec \u2192 build \u2192 test \u2192 ship',
    build: () => ({
      mon: [makeCard('Write technical spec', '30m', 'done'), makeCard('Set up branch & scaffolding', '20m', 'doing')],
      tue: [makeCard('Implement core logic', '60m')],
      wed: [makeCard('Write unit tests', '30m')],
      thu: [makeCard('Code review fixes', '30m')],
      fri: [makeCard('Deploy to staging', '20m')],
    }),
  },
  'Content Creation': {
    icon: 'film',
    blurb: 'Script \u2192 shoot \u2192 edit \u2192 publish',
    build: () => ({
      mon: [makeCard('Outline script', '20m', 'done')],
      tue: [makeCard('Record raw footage', '60m', 'doing')],
      wed: [makeCard('Rough cut edit', '45m')],
      thu: [makeCard('Color & audio pass', '30m')],
      fri: [makeCard('Write caption & description', '15m'), makeCard('Schedule & publish', '15m')],
    }),
  },
};

const STATUS_META = {
  todo:  { next: 'doing', ring: 'border-lineStrong' },
  doing: { next: 'done',  ring: 'border-amber' },
  done:  { next: 'todo',  ring: 'border-mint' },
};

/* ---------------------------------------------------------------------
   Small icons (no external icon package — kept inline and tiny)
--------------------------------------------------------------------- */

function PresetIcon({ name, className }) {
  if (name === 'cube') {
    return (
      <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round">
        <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z" />
        <path d="M12 3v18M4 7.5l8 4.5 8-4.5" />
      </svg>
    );
  }
  if (name === 'code') {
    return (
      <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
        <path d="M8 9l-4 4 4 4M16 9l4 4-4 4M13 5l-2 15" />
      </svg>
    );
  }
  return (
    <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round">
      <rect x="3" y="5" width="18" height="14" rx="1.5" />
      <path d="M7 5v14M17 5v14M3 9h4M3 15h4M17 9h4M17 15h4" />
    </svg>
  );
}

/* ---------------------------------------------------------------------
   Status icon — click to cycle todo -> doing -> done -> todo
--------------------------------------------------------------------- */

function StatusIcon({ status, onClick }) {
  const meta = STATUS_META[status];
  return (
    <button
      type="button"
      onClick={onClick}
      title={`Status: ${status}. Click to change.`}
      className={`flex-shrink-0 w-5 h-5 rounded-full border-2 ${meta.ring} flex items-center justify-center transition-colors`}
    >
      {status === 'done' && (
        <svg viewBox="0 0 24 24" className="w-3 h-3 text-mint" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
          <path d="M4 12l5 5L20 6" />
        </svg>
      )}
      {status === 'doing' && <span className="w-2 h-2 rounded-full bg-amber" />}
    </button>
  );
}

/* ---------------------------------------------------------------------
   Task card
--------------------------------------------------------------------- */

function TaskCard({ card, dayId, index, onDragStart, onDragOverCard, onCycleStatus }) {
  return (
    <div
      draggable
      onDragStart={(e) => onDragStart(e, card.id, dayId)}
      onDragOver={(e) => onDragOverCard(e, dayId, index)}
      className="card-enter group flex items-start gap-2.5 rounded-xl border border-line bg-surface px-3.5 py-3 cursor-grab active:cursor-grabbing hover:border-lineStrong hover:bg-surfaceHover transition-colors"
    >
      <StatusIcon status={card.status} onClick={() => onCycleStatus(dayId, card.id)} />
      <div className="min-w-0 flex-1">
        <p className={`text-sm leading-snug ${card.status === 'done' ? 'text-mutedDim line-through' : 'text-ink'}`}>
          {card.title}
        </p>
        <span className="mt-1.5 inline-block text-[11px] text-muted bg-white/5 border border-line rounded-full px-2 py-0.5">
          {card.duration}
        </span>
      </div>
      <svg viewBox="0 0 24 24" className="w-3.5 h-3.5 mt-1 text-mutedDim opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
        <circle cx="9" cy="6" r="1" /><circle cx="9" cy="12" r="1" /><circle cx="9" cy="18" r="1" />
        <circle cx="15" cy="6" r="1" /><circle cx="15" cy="12" r="1" /><circle cx="15" cy="18" r="1" />
      </svg>
    </div>
  );
}

/* ---------------------------------------------------------------------
   Day column
--------------------------------------------------------------------- */

function DayColumn({ id, cards, dragOverInfo, onDragStart, onDragOverCard, onDragOverColumn, onDrop, onDragLeaveColumn, onCycleStatus }) {
  const meta = DAY_META[id];
  const isTargeted = dragOverInfo && dragOverInfo.columnId === id;
  const totalMinutes = cards.reduce((sum, c) => sum + (parseInt(c.duration, 10) || 0), 0);

  return (
    <div
      onDragOver={(e) => onDragOverColumn(e, id, cards.length)}
      onDragLeave={() => onDragLeaveColumn(id)}
      onDrop={(e) => onDrop(e, id)}
      className={`flex flex-col w-[230px] flex-shrink-0 rounded-2xl border bg-black/20 p-3 min-h-[260px] transition-colors ${isTargeted ? 'border-violet/60 bg-violetSoft/20' : 'border-line'}`}
    >
      <div className="flex items-center justify-between px-1 pb-3">
        <h3 className="font-serif text-[15px] font-medium">{meta.label}</h3>
        <span className="text-[11px] text-muted bg-white/5 border border-line rounded-full px-2 py-0.5 flex-shrink-0">
          {cards.length ? `${totalMinutes}m` : '\u2014'}
        </span>
      </div>

      <div className="flex flex-col gap-2">
        {cards.map((card, index) => (
          <React.Fragment key={card.id}>
            {isTargeted && dragOverInfo.index === index && (
              <div className="h-1 rounded-full bg-violet/70 -my-0.5" />
            )}
            <TaskCard
              card={card}
              dayId={id}
              index={index}
              onDragStart={onDragStart}
              onDragOverCard={onDragOverCard}
              onCycleStatus={onCycleStatus}
            />
          </React.Fragment>
        ))}
        {isTargeted && dragOverInfo.index === cards.length && (
          <div className="h-1 rounded-full bg-violet/70 -my-0.5" />
        )}
        {cards.length === 0 && !isTargeted && (
          <div className="text-[12px] text-mutedDim border border-dashed border-lineStrong rounded-xl px-3 py-6 text-center">
            Nothing here — drag a task over
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------
   Preset sidebar
--------------------------------------------------------------------- */

function PresetSidebar({ activePreset, onSelect }) {
  return (
    <aside className="w-full lg:w-56 flex-shrink-0">
      <p className="text-[12.5px] text-mutedDim mb-3 px-1">Preset workflows</p>
      <div className="flex flex-row lg:flex-col gap-2 overflow-x-auto lg:overflow-visible pb-1 lg:pb-0">
        {Object.keys(PRESETS).map((name) => {
          const preset = PRESETS[name];
          const active = name === activePreset;
          return (
            <button
              key={name}
              type="button"
              onClick={() => onSelect(name)}
              className={`flex-shrink-0 w-56 lg:w-full text-left flex items-start gap-3 rounded-xl border px-3.5 py-3 transition-colors ${
                active
                  ? 'border-violet bg-violetSoft'
                  : 'border-line bg-surface hover:border-lineStrong hover:bg-surfaceHover'
              }`}
            >
              <span className={`flex-shrink-0 w-8 h-8 rounded-lg flex items-center justify-center ${active ? 'bg-violet text-white' : 'bg-white/5 text-muted'}`}>
                <PresetIcon name={preset.icon} className="w-4 h-4" />
              </span>
              <span className="min-w-0">
                <span className={`block text-sm font-medium ${active ? 'text-ink' : 'text-ink/90'}`}>{name}</span>
                <span className="block text-[11.5px] text-mutedDim mt-0.5 truncate">{preset.blurb}</span>
              </span>
            </button>
          );
        })}
      </div>
    </aside>
  );
}

/* ---------------------------------------------------------------------
   Write-your-own block composer + the holding tray for unplaced blocks
--------------------------------------------------------------------- */

function CustomBlockComposer({ onAdd }) {
  const [title, setTitle] = useState('');
  const [duration, setDuration] = useState(30);

  function submit(e) {
    e.preventDefault();
    const trimmed = title.trim();
    if (!trimmed) return;
    onAdd(trimmed, `${duration}m`);
    setTitle('');
  }

  return (
    <form onSubmit={submit} className="flex items-center gap-2 flex-wrap">
      <input
        value={title}
        onChange={(e) => setTitle(e.target.value)}
        placeholder="Write a task, e.g. \u201cClient call prep\u201d"
        className="flex-1 min-w-[200px] bg-bg border border-lineStrong rounded-lg px-3 py-2 text-sm text-ink placeholder:text-mutedDim focus:outline-none focus:border-violet"
      />
      <input
        type="number"
        min="5"
        step="5"
        value={duration}
        onChange={(e) => setDuration(e.target.value)}
        className="w-16 bg-bg border border-lineStrong rounded-lg px-3 py-2 text-sm text-ink focus:outline-none focus:border-violet"
      />
      <span className="text-[12px] text-mutedDim -ml-1">min</span>
      <button
        type="submit"
        className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-semibold bg-violet text-white hover:opacity-90 transition-opacity"
      >
        <svg viewBox="0 0 24 24" className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
        Add block
      </button>
    </form>
  );
}

function UnplacedTray({ cards, dragOverInfo, onAdd, onDragStart, onCycleStatus, onDragOverColumn, onDrop, onDragLeaveColumn }) {
  const isTargeted = dragOverInfo && dragOverInfo.columnId === 'unplaced';
  return (
    <div className="rounded-2xl border border-line bg-surface p-4 mb-6">
      <p className="text-[12.5px] text-mutedDim mb-3">Write your own blocks here, then drag them into a day</p>
      <CustomBlockComposer onAdd={onAdd} />
      <div
        onDragOver={(e) => onDragOverColumn(e, 'unplaced', cards.length)}
        onDragLeave={() => onDragLeaveColumn('unplaced')}
        onDrop={(e) => onDrop(e, 'unplaced')}
        className={`mt-3 flex items-center gap-2 flex-wrap min-h-[60px] rounded-xl border border-dashed p-2.5 transition-colors ${
          isTargeted ? 'border-violet/60 bg-violetSoft/20' : 'border-lineStrong'
        }`}
      >
        {cards.length === 0 && (
          <p className="text-[12px] text-mutedDim px-1.5">No custom blocks yet — write one above and drag it down.</p>
        )}
        {cards.map((card, index) => (
          <div key={card.id} className="w-56 flex-shrink-0">
            <TaskCard
              card={card}
              dayId="unplaced"
              index={index}
              onDragStart={onDragStart}
              onDragOverCard={() => {}}
              onCycleStatus={onCycleStatus}
            />
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------
   App
--------------------------------------------------------------------- */

function App() {
  const FREE_JOB_LIMIT = 1;

  const [jobs, setJobs] = useState(() => [
    { id: 'job1', name: 'Job 1', presetName: '3D Rendering Pipeline', week: { ...PRESETS['3D Rendering Pipeline'].build(), unplaced: [] } },
  ]);
  const [finishedJobs, setFinishedJobs] = useState([]);
  const [activeJobId, setActiveJobId] = useState('job1');
  const [isPro, setIsPro] = useState(false);
  const [showUpgradeModal, setShowUpgradeModal] = useState(false);
  const [showFinishModal, setShowFinishModal] = useState(false);
  const [dragOverInfo, setDragOverInfo] = useState(null); // { columnId, index }
  const [editingJobId, setEditingJobId] = useState(null);
  const [expandedFinishedId, setExpandedFinishedId] = useState(null);
  const draggingRef = useRef(null); // { cardId, fromColumn }
  const jobCounterRef = useRef(1);

  const jobLimit = isPro ? Infinity : FREE_JOB_LIMIT;
  const activeJob = jobs.find((j) => j.id === activeJobId) || jobs[0];
  const week = activeJob.week;
  const presetName = activeJob.presetName;

  function updateActiveJobWeek(updater) {
    setJobs((prev) => prev.map((j) => (j.id === activeJobId ? { ...j, week: updater(j.week) } : j)));
  }

  function applyPreset(name) {
    setJobs((prev) => prev.map((j) => (j.id === activeJobId ? { ...j, presetName: name, week: { ...PRESETS[name].build(), unplaced: j.week.unplaced } } : j)));
  }

  function addCustomBlock(title, duration) {
    updateActiveJobWeek((prev) => ({
      ...prev,
      unplaced: [...prev.unplaced, makeCard(title, duration)],
    }));
  }

  function renameJob(jobId, newName) {
    const trimmed = newName.trim();
    if (!trimmed) return;
    setJobs((prev) => prev.map((j) => (j.id === jobId ? { ...j, name: trimmed } : j)));
  }

  function addJob() {
    if (jobs.length >= jobLimit) {
      setShowUpgradeModal(true);
      return;
    }
    jobCounterRef.current += 1;
    const defaultPreset = '3D Rendering Pipeline';
    const newId = `job${jobCounterRef.current}`;
    const newName = `Job ${jobCounterRef.current}`;
    setJobs((prev) => [...prev, { id: newId, name: newName, presetName: defaultPreset, week: { ...PRESETS[defaultPreset].build(), unplaced: [] } }]);
    setActiveJobId(newId);
  }

  function taskCounts(weekObj) {
    let total = 0, done = 0;
    DAYS.forEach((d) => weekObj[d].forEach((c) => { total += 1; if (c.status === 'done') done += 1; }));
    return { total, done };
  }

  function requestFinishJob() {
    setShowFinishModal(true);
  }

  function confirmFinishJob() {
    const { total, done } = taskCounts(activeJob.week);
    const snapshot = {
      id: `${activeJob.id}-${Date.now()}`,
      name: activeJob.name,
      presetName: activeJob.presetName,
      finishedAt: new Date(),
      totalTasks: total,
      doneTasks: done,
      week: activeJob.week,
      proofId: Math.random().toString(16).slice(2, 8),
    };
    setFinishedJobs((prev) => [snapshot, ...prev]);

    setJobs((prev) => {
      const remaining = prev.filter((j) => j.id !== activeJob.id);
      if (remaining.length > 0) {
        setActiveJobId(remaining[0].id);
        return remaining;
      }
      jobCounterRef.current += 1;
      const defaultPreset = '3D Rendering Pipeline';
      const newId = `job${jobCounterRef.current}`;
      const fresh = { id: newId, name: `Job ${jobCounterRef.current}`, presetName: defaultPreset, week: { ...PRESETS[defaultPreset].build(), unplaced: [] } };
      setActiveJobId(newId);
      return [fresh];
    });

    setShowFinishModal(false);
  }

  function upgradeToPro() {
    setIsPro(true);
    setShowUpgradeModal(false);
  }

  function handleDragStart(e, cardId, fromColumn) {
    draggingRef.current = { cardId, fromColumn };
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', cardId);
  }

  function handleDragOverCard(e, columnId, index) {
    e.preventDefault();
    e.stopPropagation();
    setDragOverInfo({ columnId, index });
  }

  function handleDragOverColumn(e, columnId, endIndex) {
    e.preventDefault();
    setDragOverInfo((prev) => {
      if (prev && prev.columnId === columnId && prev.index !== undefined && prev.index < endIndex) {
        return prev;
      }
      return { columnId, index: endIndex };
    });
  }

  function handleDragLeaveColumn(columnId) {
    setDragOverInfo((prev) => (prev && prev.columnId === columnId ? null : prev));
  }

  function handleDrop(e, targetColumn) {
    e.preventDefault();
    const drag = draggingRef.current;
    const info = dragOverInfo;
    draggingRef.current = null;
    setDragOverInfo(null);
    if (!drag) return;

    updateActiveJobWeek((prev) => {
      const next = {};
      ALL_COLUMNS.forEach((d) => { next[d] = [...prev[d]]; });

      const fromArr = next[drag.fromColumn];
      const fromIndex = fromArr.findIndex((c) => c.id === drag.cardId);
      if (fromIndex === -1) return prev;
      const [moved] = fromArr.splice(fromIndex, 1);

      const toArr = next[targetColumn];
      let insertAt = info && info.columnId === targetColumn ? info.index : toArr.length;
      if (drag.fromColumn === targetColumn && fromIndex < insertAt) insertAt -= 1;
      insertAt = Math.max(0, Math.min(insertAt, toArr.length));
      toArr.splice(insertAt, 0, moved);

      return next;
    });
  }

  function handleCycleStatus(dayId, cardId) {
    updateActiveJobWeek((prev) => ({
      ...prev,
      [dayId]: prev[dayId].map((c) => (c.id === cardId ? { ...c, status: STATUS_META[c.status].next } : c)),
    }));
  }

  const totalTasks = DAYS.reduce((sum, d) => sum + week[d].length, 0);

  return (
    <div className="max-w-6xl mx-auto px-6 py-10">

      <header className="flex items-center gap-2.5 mb-8">
        <a href="sideby-landing.html" className="flex items-center gap-2.5 hover:opacity-80 transition-opacity">
          <div className="w-7 h-7 rounded-[9px] bg-gradient-to-br from-violet to-[#5B49C4] flex items-center justify-center font-serif font-semibold text-white text-sm flex-shrink-0">S</div>
          <span className="font-serif text-[19px] tracking-tight">Sideby</span>
        </a>
        <span className="text-mutedDim">/</span>
        <span className="text-muted text-sm">Task Planning</span>
        <span className={`ml-1 text-[11px] font-semibold px-2 py-0.5 rounded-full ${isPro ? 'text-mint bg-mintSoft' : 'text-muted bg-white/5 border border-line'}`}>
          {isPro ? 'Pro' : 'Free'}
        </span>
      </header>

      <div className="flex items-center gap-2 mb-6 flex-wrap">
        {jobs.map((job) => (
          <div
            key={job.id}
            className={`flex items-center gap-1.5 pl-3.5 pr-2 py-1.5 rounded-lg text-sm border transition-colors ${
              job.id === activeJobId
                ? 'bg-violetSoft border-violet text-ink'
                : 'border-line text-muted hover:border-lineStrong hover:text-ink'
            }`}
          >
            {editingJobId === job.id ? (
              <input
                autoFocus
                defaultValue={job.name}
                onBlur={(e) => { renameJob(job.id, e.target.value); setEditingJobId(null); }}
                onKeyDown={(e) => {
                  if (e.key === 'Enter') { renameJob(job.id, e.target.value); setEditingJobId(null); }
                  if (e.key === 'Escape') setEditingJobId(null);
                }}
                className="bg-transparent text-ink text-sm outline-none w-28"
              />
            ) : (
              <button type="button" onClick={() => setActiveJobId(job.id)} className="text-left">
                {job.name}
              </button>
            )}
            <button
              type="button"
              title="Rename job"
              onClick={() => { setActiveJobId(job.id); setEditingJobId(job.id); }}
              className="opacity-50 hover:opacity-100 transition-opacity flex-shrink-0"
            >
              <svg viewBox="0 0 24 24" className="w-3 h-3" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
              </svg>
            </button>
          </div>
        ))}
        <button
          type="button"
          onClick={addJob}
          className={`flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-sm border border-dashed transition-colors ${
            jobs.length >= jobLimit
              ? 'border-lineStrong text-mutedDim'
              : 'border-lineStrong text-muted hover:border-violet hover:text-ink'
          }`}
        >
          <svg viewBox="0 0 24 24" className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
          New job
          {jobs.length >= jobLimit && !isPro && (
            <span className="text-[10px] font-semibold text-violet bg-violetSoft px-1.5 py-0.5 rounded-full ml-0.5">PRO</span>
          )}
        </button>

        <button
          type="button"
          onClick={requestFinishJob}
          className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-sm border border-mint/40 text-mint hover:bg-mintSoft transition-colors ml-auto"
        >
          <svg viewBox="0 0 24 24" className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M4 12l5 5L20 6" />
          </svg>
          Finish job
        </button>
      </div>

      <div className="mb-6">
        <h1 className="font-serif text-[26px] font-medium tracking-tight mb-1.5">Plan the shape of your work</h1>
        <p className="text-muted text-sm max-w-lg">Pick a preset on the left to spread its usual tasks across the week, write your own blocks below, then drag anything to a different day — nothing here is graded.</p>
      </div>

      <UnplacedTray
        cards={week.unplaced}
        dragOverInfo={dragOverInfo}
        onAdd={addCustomBlock}
        onDragStart={handleDragStart}
        onCycleStatus={handleCycleStatus}
        onDragOverColumn={handleDragOverColumn}
        onDrop={handleDrop}
        onDragLeaveColumn={handleDragLeaveColumn}
      />

      <div className="flex flex-col lg:flex-row gap-6">
        <PresetSidebar activePreset={presetName} onSelect={applyPreset} />

        <div className="flex-1 min-w-0 overflow-x-auto pb-2">
          <div className="flex gap-3 w-max">
            {DAYS.map((id) => (
              <DayColumn
                key={id}
                id={id}
                cards={week[id]}
                dragOverInfo={dragOverInfo}
                onDragStart={handleDragStart}
                onDragOverCard={handleDragOverCard}
                onDragOverColumn={handleDragOverColumn}
                onDrop={handleDrop}
                onDragLeaveColumn={handleDragLeaveColumn}
                onCycleStatus={handleCycleStatus}
              />
            ))}
          </div>
        </div>
      </div>

      <p className="text-center text-[12.5px] text-mutedDim mt-8">
        {totalTasks} tasks this week · drag any card to a different day, guilt-free.
      </p>

      {finishedJobs.length > 0 && (
        <div className="mt-12">
          <p className="text-[12.5px] text-mutedDim mb-3">Finished jobs · proof of work</p>
          <div className="flex flex-col gap-2">
            {finishedJobs.map((fj) => {
              const expanded = expandedFinishedId === fj.id;
              return (
                <div key={fj.id} className="rounded-xl border border-line bg-surface overflow-hidden">
                  <button
                    type="button"
                    onClick={() => setExpandedFinishedId(expanded ? null : fj.id)}
                    className="w-full flex items-center justify-between gap-4 px-4 py-3 text-left"
                  >
                    <div className="min-w-0">
                      <p className="text-sm font-medium text-ink truncate">{fj.name}</p>
                      <p className="text-[12px] text-mutedDim mt-0.5">
                        {fj.presetName} · finished {fj.finishedAt.toLocaleDateString()} · {fj.doneTasks}/{fj.totalTasks} tasks done
                      </p>
                    </div>
                    <span className="flex-shrink-0 text-[11px] font-mono text-mint bg-mintSoft px-2 py-1 rounded-full">
                      #{fj.proofId}
                    </span>
                  </button>
                  {expanded && (
                    <div className="px-4 pb-4 border-t border-line pt-3">
                      <div className="grid grid-cols-1 sm:grid-cols-5 gap-2">
                        {DAYS.map((d) => (
                          <div key={d}>
                            <p className="text-[11px] text-mutedDim mb-1.5">{DAY_META[d].label}</p>
                            <div className="flex flex-col gap-1">
                              {fj.week[d].length === 0 && <p className="text-[11px] text-mutedDim">—</p>}
                              {fj.week[d].map((c) => (
                                <p key={c.id} className={`text-[12px] ${c.status === 'done' ? 'text-muted line-through' : 'text-ink'}`}>
                                  {c.title}
                                </p>
                              ))}
                            </div>
                          </div>
                        ))}
                      </div>
                      {fj.week.unplaced && fj.week.unplaced.length > 0 && (
                        <div className="mt-3 pt-3 border-t border-line">
                          <p className="text-[11px] text-mutedDim mb-1.5">Written but never scheduled</p>
                          <div className="flex flex-col gap-1">
                            {fj.week.unplaced.map((c) => (
                              <p key={c.id} className="text-[12px] text-muted">{c.title}</p>
                            ))}
                          </div>
                        </div>
                      )}
                      <p className="text-[11.5px] text-mutedDim mt-3">Keep this on hand as a record of the work done, in case a client ever disputes the timeline.</p>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {showFinishModal && (
        <div
          className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 px-5"
          onClick={() => setShowFinishModal(false)}
        >
          <div
            className="bg-surface border border-lineStrong rounded-2xl p-7 max-w-sm w-full text-center"
            onClick={(e) => e.stopPropagation()}
          >
            <span className="inline-block text-[12.5px] text-mint bg-mintSoft px-3 py-1 rounded-full mb-4">Proof of work</span>
            <h2 className="font-serif text-xl font-medium mb-2">Finish "{activeJob.name}"?</h2>
            <p className="text-muted text-sm mb-6">
              This saves a snapshot — {taskCounts(activeJob.week).done} of {taskCounts(activeJob.week).total} tasks done — to your finished jobs list, then starts a fresh job.
            </p>
            <div className="flex flex-col gap-2.5">
              <button
                type="button"
                onClick={confirmFinishJob}
                className="bg-mint text-[#0E1613] font-semibold text-sm rounded-xl py-3 hover:opacity-90 transition-opacity"
              >
                Save & finish
              </button>
              <button
                type="button"
                onClick={() => setShowFinishModal(false)}
                className="text-muted text-sm py-2 hover:text-ink transition-colors"
              >
                Keep working
              </button>
            </div>
          </div>
        </div>
      )}

      {showUpgradeModal && (
        <div
          className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 px-5"
          onClick={() => setShowUpgradeModal(false)}
        >
          <div
            className="bg-surface border border-lineStrong rounded-2xl p-7 max-w-sm w-full text-center"
            onClick={(e) => e.stopPropagation()}
          >
            <span className="inline-block text-[12.5px] text-violet bg-violetSoft px-3 py-1 rounded-full mb-4">Sideby Pro</span>
            <h2 className="font-serif text-xl font-medium mb-2">Plan more than one job at a time</h2>
            <p className="text-muted text-sm mb-6">Free plans can keep one job going. Upgrade to Pro to juggle as many as you need, side by side.</p>
            <div className="flex flex-col gap-2.5">
              <button
                type="button"
                onClick={upgradeToPro}
                className="bg-violet text-white font-semibold text-sm rounded-xl py-3 hover:opacity-90 transition-opacity"
              >
                Upgrade to Pro
              </button>
              <button
                type="button"
                onClick={() => setShowUpgradeModal(false)}
                className="text-muted text-sm py-2 hover:text-ink transition-colors"
              >
                Maybe later
              </button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
